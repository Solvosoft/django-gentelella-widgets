[project]
# This is the name of your project. The first time you publish this
# package, this name will be registered for you. It will determine how
# users can install this project, e.g.:
#
# $ pip install sampleproject
#
# And where it will live on PyPI: https://pypi.org/project/sampleproject/
#
# There are some restrictions on what makes a valid project name
# specification here:
# https://packaging.python.org/specifications/core-metadata/#name
name = "djgentelella"  # Required

# Versions should comply with PEP 440:
# https://www.python.org/dev/peps/pep-0440/
#
# For a discussion on single-sourcing the version, see
# https://packaging.python.org/guides/single-sourcing-package-version/
dynamic = ["version"]

# This is a one-line description or tagline of what your project does. This
# corresponds to the "Summary" metadata field:
# https://packaging.python.org/specifications/core-metadata/#summary
description = "Help building extra widgets for forms and speciall methods to render forms in templates"  # Optional

# This is an optional longer description of your project that represents
# the body of text which users will see when they visit PyPI.
#
# Often, this is the same as your README, so you can just read it in from
# that file directly (as we have already done above)
#
# This field corresponds to the "Description" metadata field:
# https://packaging.python.org/specifications/core-metadata/#description-optional
readme = { file = "README.rst", content-type = "text/x-rst" }  # Optional

# Specify which Python versions you support. In contrast to the
# 'Programming Language' classifiers above, 'pip install' will check this
# and refuse to install the project if the version does not match. See
# https://packaging.python.org/guides/distributing-packages-using-setuptools/#python-requires
requires-python = ">=3.11"

# PEP 639: an SPDX expression, not a file. The `{ file = ... }` table it
# replaces is deprecated from setuptools 77 (removal 2027-02-18) and inlined the
# whole 354 line GPL text into the License: metadata field. LICENSE.txt is the
# GPL v2 text; an old setup.py classifier claimed GPLv3+, which never matched
# the file that shipped. v2-or-later is the resolution.
# https://packaging.python.org/en/latest/specifications/license-expression/
license = "GPL-2.0-or-later"
license-files = ["LICENSE.txt", "AUTHORS"]


# This field adds keywords for your project which will appear on the
# project page. What does your project relate to?
#
# Note that this is a list of additional keywords, separated
# by commas, to be used to assist searching for the distribution in a
# larger catalog.
keywords = ["Django", "selects", "development", "forms", "framework", "widgets"]  # Optional

# This should be your name or the name of the organization who originally
# authored the project, and a valid email address corresponding to the name
# listed.
authors = [
    { name = "Solvosoft", email = "info@solvosoft.com" } # Optional
]

# This should be your name or the names of the organization who currently
# maintains the project, and a valid email address corresponding to the name
# listed.
maintainers = [
    { name = "Luis Zarate Montero", email = "luis.zarate@solvosoft.com" } # Optional
]

# Classifiers help users find your project by categorizing it.
#
# For a list of valid classifiers, see https://pypi.org/classifiers/
classifiers = [# Optional
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    # Specify the Python versions you support here. In particular, ensure
    # that you indicate you support Python 3. These classifiers are *not*
    # checked by "pip install". See instead "python_requires" below.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]

# This field lists other packages that your project depends on to run.
# Any package you put here will be installed by pip when your project is
# installed, so they must be valid existing projects.
#
# For an analysis of this field vs pip's requirements files see:
# https://packaging.python.org/discussions/install-requires-vs-requirements/
dependencies = [# Optional
    'django-tree-queries>=0.11.0',
    'Pillow',
    'djangorestframework>=3.15.2',
    'django>=5.2',
    'django-filter>=22.1',
    'pycryptodome>=3.23.0'
]

# List additional groups of dependencies here (e.g. development
# dependencies). Users will be able to install these using the "extras"
# syntax, for example:
#
#   $ pip install sampleproject[dev]
#
# Similar to `dependencies` above, these must be valid existing
# projects.
[project.optional-dependencies] # Optional
dev = [
    'pylp', 'pylpconcat', 'css-html-js-minify'
]
# Lower bounds, not pins: this is a library, and an `==` here cannot be
# overridden by the application installing it -- "requests==2.32.4" makes
# djgentelella[firmador] unusable next to anything that needs a newer one, and
# conflicts with the >= in asr-remote below.
firmador = [
    "django-cors-headers>=4.6.0",
    # uvicorn serves the ASGI application; wsproto is its websocket
    # implementation (plain uvicorn ships none, it only comes with
    # uvicorn[standard]), so the signing websocket needs it.
    "uvicorn>=0.51.0",
    "uvicorn-worker>=0.4.0",
    "channels>=4.2.0",
    "wsproto>=1.2.0",
    "requests>=2.32.4"
]
# Celery backend for async_notification. Without it the notifications are
# dispatched synchronously by SyncBackend, no configuration needed. Redis
# transport bundled in: it's what `scripts/run_services.sh --celery` provides.
celery = [
    "celery[redis]>=5.3"
]
# Speech recognition for the voice dictation widgets. Neither extra is needed
# to install or import djgentelella: the widgets ship with it, only the
# transcription endpoint needs a backend, and the imports are lazy.
#
# `asr` is the local backend (GENTELELLA_ASR_BACKEND = 'local'): in-process
# Parakeet-v3, where onnx-asr runs the model on CPU and av (PyAV) decodes the
# uploaded audio. It is heavy -- the first request downloads a ~670 MB model.
asr = [
    "onnx-asr[cpu,hub]>=0.11.0",
    "av>=11.0",
    "numpy>=1.24.0"
]
# `asr-remote` is the remote backend (GENTELELLA_ASR_BACKEND = 'remote'), which
# forwards the audio to an external ASR API and so needs nothing but an HTTP
# client. Install this one instead of `asr` when the transcription runs
# elsewhere.
asr-remote = [
    "requests>=2.32.4"
]

# List URLs that are relevant to your project
#
# This field corresponds to the "Project-URL" and "Home-Page" metadata fields:
# https://packaging.python.org/specifications/core-metadata/#project-url-multiple-use
# https://packaging.python.org/specifications/core-metadata/#home-page-optional
#
# Examples listed include a pattern for specifying where the package tracks
# issues, where the source is hosted, where to say thanks to the package
# maintainers, and where to support the project financially. The key is
# what's used to render the link text on PyPI.
[project.urls]  # Optional
"Homepage" = "https://github.com/Solvosoft/django-gentelella-widgets"
"Bug Reports" = "https://github.com/Solvosoft/django-gentelella-widgets/issues"
"Funding" = "https://github.com/sponsors/Solvosoft"


# The following would provide a command line executable called `sample`
# which executes the function `main` from this package when invoked.
#[project.scripts]  # Optional
#sample = "sample:main"

# This is configuration specific to the `setuptools` build backend.
# If you are using a different build backend, you will need to change this.
[tool.setuptools.packages.find]
include = ["djgentelella*"]
# Tests are excluded from the distribution: they are written against the demo
# project, so `djgentelella.tests` raises ModuleNotFoundError: demoapp on an
# installed copy. Shipping 36 unimportable test modules only breaks anything
# that walks the package (pytest --pyargs, coverage, an import scanner).
exclude = ["docs*", "demo*", "*.tests", "*.tests.*"]


[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
# No ceiling: it was added along with the setup.py -> pyproject migration with
# no reason recorded, and building with setuptools 83 produces a byte-identical
# file list (1108 in the wheel, 1243 in the sdist). The floor is 77 because that
# is where the PEP 639 `license` expression above is understood.
# `wheel` is not listed: setuptools has carried bdist_wheel itself since 70.1.
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "djgentelella.__version__" }

# Style (line length, whitespace, ...) stays with pycodestyle in setup.cfg,
# which is what `make lint` has always run. Ruff is here only for the checks
# pycodestyle has no equivalent for -- today, import placement.
[tool.ruff]
line-length = 88
# Mirrors the `exclude` in setup.cfg: generated migrations and the two files
# that carry vendored URL tables.
extend-exclude = ["migrations", "loaddevstatic.py", "gtstorymap.py"]

# Single quotes are what this codebase has always used. A `ruff format` run
# with the default (double) is what split the tree in two, so the preference is
# recorded here rather than left to whoever runs the formatter next. It only
# takes effect if someone runs `ruff format`; the rule that is actually
# enforced by `make lint` is Q, configured under [tool.ruff.lint] below.
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# PLC0415 (import-outside-top-level): imports belong at the top of the module.
# A function-level import is allowed only where it is genuinely required --
# an optional dependency, an AppConfig.ready() that runs before the app
# registry is populated, or a circular import -- and each such case has to be
# marked with `# noqa: PLC0415` plus a comment saying which of the three it is.
#
# Q (flake8-quotes): quote style. Enforced as a lint rule rather than by
# running `ruff format`, because the formatter would also re-wrap lines and
# rewrite trailing commas across the whole tree -- 11k lines of churn to fix a
# quote character. This keeps `make lint` failing when double quotes creep back
# in without reformatting anything else.
select = ["PLC0415", "Q"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
# Docstrings and triple-quoted blocks stay double: that is PEP 257, and it is
# already what the whole tree does.
multiline-quotes = "double"
docstring-quotes = "double"

# `make coverage` / `make coverage-all`. The tests only run from demo/, so the
# measured tree is named by package (`source_pkgs`) and not by path: a relative
# `source` would resolve against demo/ and measure nothing.
[tool.coverage.run]
source_pkgs = ["djgentelella"]
branch = true
# The unit pass and the selenium pass are two separate processes writing to the
# same COVERAGE_FILE; without this the second would overwrite the first.
parallel = true
# No `relative_files`: it would store the paths relative to demo/, which is
# where the runs happen, and `coverage report` runs from the repository root.
omit = [
    "*/migrations/*",
    # The test modules themselves: measuring them says nothing about the
    # library and only inflates the total.
    "*/tests/*",
    "*/tests.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
