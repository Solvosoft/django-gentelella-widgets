{% load i18n %}

<div aria-hidden="true" id="{{ modal_id }}" class="modal fade"
	data-bs-focus="false" role="dialog" tabindex="-1">
	<div class="modal-dialog modal-xl" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">{{ title }}</h5>
				<button aria-label="{% trans 'Close' %}" class="btn-close" data-bs-dismiss="modal" type="button"></button>
			</div>
			<div class="modal-body">
				<div class="row an-editor-preview">
					<div class="col-md-7">
						<form id="{{ form_id }}" method="POST" autocomplete="off" action="{{ url }}">
							{% csrf_token %}
							{{ form }}
							<input type="hidden" name="prefix" class="form_prefix" value="{{ form.prefix|default_if_none:'' }}">
						</form>
					</div>
					<div class="col-md-5">
						{% if show_inspector %}
						<div class="card">
							<div class="card-header py-2"><h6 class="mb-0">{% trans "Variables" %}</h6></div>
							<div class="card-body model-fields-tree">
								<p class="text-muted small">{% trans "Select a context code to inspect available fields." %}</p>
							</div>
						</div>
						{% endif %}
						<div class="card mt-2">
							<div class="card-header py-2 d-flex justify-content-between align-items-center">
								<h6 class="mb-0">{% trans "Preview" %}</h6>
								<button class="btn btn-info btn-sm btn-preview-template" type="button">
									<i class="fa fa-eye"></i> {% trans "Refresh" %}
								</button>
							</div>
							<div class="card-body">
								<iframe class="an-preview-frame"></iframe>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">{% trans 'Close' %}</button>
				<button class="btn btn-primary formadd" type="button">{% trans 'Save changes' %}</button>
			</div>
		</div>
	</div>
</div>
