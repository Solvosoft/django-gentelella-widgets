{% load i18n %}
{# Read-only preview modal used by the DataTable "preview" row action. #}
<div aria-hidden="true" id="preview_modal" class="modal fade"
	data-bs-focus="false" role="dialog" tabindex="-1">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">{% trans "Preview" %}</h5>
				<button aria-label="{% trans 'Close' %}" class="btn-close" data-bs-dismiss="modal" type="button"></button>
			</div>
			<div class="modal-body">
				<div class="mb-2">
					<strong>{% trans "Subject" %}:</strong> <span id="preview-subject"></span>
				</div>
				<div id="preview-meta" class="small text-muted mb-2"></div>
				<iframe class="an-preview-frame" style="min-height:400px;"></iframe>
			</div>
			<div class="modal-footer">
				<button class="btn btn-secondary" data-bs-dismiss="modal" type="button">{% trans 'Close' %}</button>
			</div>
		</div>
	</div>
</div>
