{% load gentelellamenu gtsettings gttheme %}

<div class="left_col gt-sidebar">
	
  <div class="navbar nav_title mb-4" style="border: 0;">
    {% gt_theme_logo_url as theme_logo %}<a href="{% url 'home' %}" class="site_title">{% if theme_logo %}<img src="{{ theme_logo }}" alt="" class="gt-theme-logo" style="max-height:40px;max-width:48px;vertical-align:middle">{% else %}<i class="{% get_settings 'sidebar_icon' 'fa fa-spinner' %}"></i>{% endif %} <span>{% if sidebar_title %}{{ sidebar_title }}{% else %}{% get_settings 'sidebar_title' 'My Site' %}{% endif %}</span></a>
  </div>

	<div class="clearfix"></div>

	<!-- sidebar menu -->

	<div id="sidebar-menu" class="main_menu_side d-print-none main_menu">

		{% sidebar_menu %}

	</div>
	<!-- /sidebar menu -->


	<!-- /menu footer buttons -->
	<div class="sidebar-footer d-print-none nohidden">
		{% footer_sidebar_menu %}
	</div>
	<!-- /menu footer buttons -->

</div>
