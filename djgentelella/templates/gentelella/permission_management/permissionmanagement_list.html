{% load i18n %}

{% for key, value in categories.items %}
	<a class="btn categories" data-bs-toggle="collapse" data-bs-target="#category{{ key|cut:' ' }}"><i
		class="fa fa-plus"></i></a> <strong>{% trans key %}</strong>
	<div id="category{{ key|cut:' ' }}" class="collapse" style="width:100%">
		{% for item in value %}
			<div class="row" style="margin-left: 12%;">
				<p class="d-flex align-items-center gap-2 mb-1">
					<input id="checkbox_perms_{{ item.id }}" type="checkbox" class="gt-check" name="permission" value="{{ item.id }}">
					<label for="checkbox_perms_{{ item.id }}" class="mb-0" style="cursor: pointer;">
						{% trans item.name %}
					</label>
				</p>
			</div>
		{% endfor %}
	</div>
	<br>
{% endfor %}
