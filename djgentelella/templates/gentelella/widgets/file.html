{% load i18n %}

<div class="fileupload">
<div class="input-group flex-nowrap">
  <div class="input-group-text {{ widget.name }}_progress"><i class="fa fa-file"></i></div>
  <div class="uploadfilecontent chunkedupload">
    <input class="chunkedupload-input" type="{{ widget.type }}" data-inputtoken="{{ widget.name }}" data-process=".{{ widget.name }}_progress"  data-message=".{{ widget.name }}_messages"  name="{{ widget.name }}_widget" {% include "gentelella/widgets/attrs.html" %}>
            <span class="gt-upload-hint">
                <i class="fa fa-cloud-upload" aria-hidden="true"></i>
                <span><strong>{% trans 'Choose a file' %}</strong><span
                    class="gt-upload-hint-long"> {% trans 'or drop it here' %}</span></span>
            </span>
  </div>
  <div class="form-control {{ widget.name }}_messages" style="display:none;"></div>
   <input type="hidden" name="{{ widget.name }}" value="{{ widget.value|default:''  }}"  autocomplete="off" />
   <div class="input-group-text fileshow" role="button" tabindex="0"
             title="{% trans 'Show or change the file' %}"><i class="fa fa-eye"></i></div>
        <div id="download_{{ widget.name }}" class="input-group-text" {% if not widget.value %}style="display:none;"{% endif %} >
            <a href="{% if widget.value %}{{widget.value.url}}{%endif%}" target="_blank" title="{% trans 'Download' %}"><i class="fa fa-download"></i></a>
        </div>
    </div>
    <div class="gt-upload-progress" aria-hidden="true"></div>
    <div id="remove_{{ widget.name }}" class="gt-upload-remove">
        <label>
            <input id="id_remove_{{ widget.name }}" type="checkbox" autocomplete="off" data-widget="CheckboxInput" name="remove_{{ widget.name }}_gt" class="gt-check">
            <span class="gt-upload-remove-text">{% trans 'Delete this file' %}</span>
        </label>
    </div>
</div>
