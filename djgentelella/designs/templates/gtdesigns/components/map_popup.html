<div class="gtmap-popup"><strong class="gtmap-popup-title">{{ texts.title }}</strong>{% if texts.subtitle %}<br><span class="text-muted">{{ texts.subtitle }}</span>{% endif %}
{% if texts.fields %}<dl class="small mb-1 mt-1">{% for item in texts.fields %}<dt>{{ item.label }}</dt><dd class="mb-0">{{ item.value }}</dd>{% endfor %}</dl>{% endif %}
{% for link in links %}<a class="gtmap-popup-link me-2" href="{{ link.url }}"><i class="{{ link.icon }}" aria-hidden="true"></i> {{ link.title }}</a>{% endfor %}</div>
