name: Django CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # requirements.txt only sets `django>=5.2`, so an unconstrained install
        # always resolves to the newest release and 5.2 -- the declared minimum,
        # and the LTS most deployments are on -- would never be exercised.
        # Both ends are pinned here on purpose.
        python-version: ['3.11', '3.12', '3.13']
        django-version: ['5.2', '6.0']
        exclude:
          # Django 6.0 dropped Python 3.11
          - python-version: '3.11'
            django-version: '6.0'

    steps:

    - name: Add Actions checkout
      uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test_requirements.txt
        pip install "django~=${{ matrix.django-version }}.0"
    - name: Lint
      run: make lint

    - name: Check for uncommitted migrations
      run: |
        cd demo/
        python manage.py makemigrations --check --dry-run

    # The .mo files are not committed: they are compiled here, so the suite runs
    # with the Spanish catalog the demo (LANGUAGE_CODE = 'es') would load.
    - name: Compile translations
      run: |
        sudo apt-get install -y gettext
        make trans

    - name: Run Tests
      run: |
        cd demo/
        python manage.py createbasejs
        python manage.py loaddevstatic
        cd ..
        # every label, the same command as `make test`
        make test


  # The tools built on djgentelella, against this commit: their suites catch a
  # change of the public API they use before they pin a release. Informative
  # (continue-on-error) until the maintainers decide to make them a gate.
  editor:
    name: djgentelella-editor (main) on this commit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout djgentelella
      uses: actions/checkout@v5
      with:
        path: djgentelella
    - name: Checkout djgentelella-editor
      uses: actions/checkout@v5
      with:
        repository: Solvosoft/djgentelella-editor
        ref: main
        path: editor
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    # djgentelella first, editable from the checkout, so installing the editor
    # finds it satisfied instead of fetching a release or its master.
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e "./djgentelella[designs]"
        pip install -e "./editor[dev]"
        python -c "import djgentelella, pathlib, sys; path = pathlib.Path(djgentelella.__file__).resolve(); print(path); sys.exit(pathlib.Path('djgentelella').resolve() not in path.parents)"

    - name: Tests
      working-directory: editor
      run: make test

  # djodo has no public remote yet: set the repository variable DJODO_GIT (a
  # clone URL; DJODO_REF picks the branch, main by default) to run it.
  djodo:
    name: djodo on this commit
    if: ${{ vars.DJODO_GIT != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DJODO_GIT: ${{ vars.DJODO_GIT }}
      DJODO_REF: ${{ vars.DJODO_REF || 'main' }}

    steps:
    - name: Checkout djgentelella
      uses: actions/checkout@v5
      with:
        path: djgentelella
    - name: Clone djodo
      run: git clone --depth 1 --branch "$DJODO_REF" "$DJODO_GIT" djodo
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e "./djgentelella[designs]"
        pip install -e "./djodo[dev,pdf,xlsx,docx]"
        python -c "import djgentelella, pathlib, sys; path = pathlib.Path(djgentelella.__file__).resolve(); print(path); sys.exit(pathlib.Path('djgentelella').resolve() not in path.parents)"

    # The vendors are not in djgentelella's git tree, as in djodo's own CI.
    - name: djgentelella static
      working-directory: djodo/demo
      run: |
        DB_ENGINE=sqlite python manage.py loaddevstatic
        DB_ENGINE=sqlite python manage.py createbasejs

    - name: Tests
      working-directory: djodo
      run: make test
