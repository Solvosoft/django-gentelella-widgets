name: Django CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # requirements.txt only sets `django>=5.2`, so an unconstrained install
        # always resolves to the newest release and 5.2 -- the declared minimum,
        # and the LTS most deployments are on -- would never be exercised.
        # Both ends are pinned here on purpose.
        python-version: ['3.11', '3.12', '3.13']
        django-version: ['5.2', '6.0']
        exclude:
          # Django 6.0 dropped Python 3.11
          - python-version: '3.11'
            django-version: '6.0'

    steps:

    - name: Add Actions checkout
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test_requirements.txt
        pip install "django~=${{ matrix.django-version }}.0"
    - name: Lint
      run: make lint

    - name: Check for uncommitted migrations
      run: |
        cd demo/
        python manage.py makemigrations --check --dry-run

    - name: Run Tests
      run: |
        cd demo/
        python manage.py createbasejs
        python manage.py loaddevstatic
        python manage.py test --exclude-tag=selenium
        python manage.py test djgentelella.tests
        # the blog lives outside the demo dir, so discovery never reaches it
        python manage.py test djgentelella.blog.tests

