# pycodestyle reads setup.cfg / tox.ini, never pyproject.toml, so the lint
# configuration has to live here. `make lint` and the CI job both pick it up.
[pycodestyle]
max-line-length = 88

# pycodestyle's own defaults (E121,E123,E126,E226,E24,E704,W503,W504) plus:
#   E203  whitespace before ':' -- the slice style black/ruff format produces.
#         pycodestyle and the formatter disagree here and the formatter wins,
#         since it is what keeps the rest of the file conformant.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203

# migrations/  is generated by `makemigrations`: the long verbose_name and
#              help_text lines are Django's output, not something to reformat.
# loaddevstatic.py, gtstorymap.py  carry vendored/long URL tables.
exclude = .git,__pycache__,build,dist,migrations,loaddevstatic.py,gtstorymap.py
